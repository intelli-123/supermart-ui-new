name: Build, Push & Deploy — Test Supermart UI

on:
  workflow_dispatch:
  push:
    branches: [main, deploy-gcp]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  id-token: write   # required for OIDC to GCP

env:
  TF_VERSION: '1.7.5'
  GCP_PROJECT_ID: proven-country-485607-p6
  GCP_PROJECT_NUMBER: 766156983150
  WIF_POOL_ID: github-wif-pool
  WIF_PROVIDER_ID: github
  GCP_SA_EMAIL: github-wif-sa@proven-country-485607-p6.iam.gserviceaccount.com
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'test-supermart-api' }}
  UI_IMAGE_NAME: ${{ vars.UI_IMAGE_NAME || 'test-supermart-ui' }}
  GCR_HOST: ${{ vars.GCR_HOST || 'gcr.io' }}
  REGION: us-central1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build Docker image and push to GCR
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      ui_image_ref: ${{ steps.image.outputs.ui_image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_PROVIDER_ID }}
          service_account: ${{ env.GCP_SA_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 466.0.0'

      - name: Enable required GCP APIs
        run: |
          set -euo pipefail
          gcloud --quiet services enable \
            artifactregistry.googleapis.com \
            cloudbuild.googleapis.com \
            cloudresourcemanager.googleapis.com \
            compute.googleapis.com \
            iam.googleapis.com \
            run.googleapis.com \
            servicenetworking.googleapis.com \
            sqladmin.googleapis.com \
            vpcaccess.googleapis.com

      # Ensure the gcr.io-style Artifact Registry repo exists (idempotent)
      - name: Ensure gcr.io repo exists in Artifact Registry
        run: |
          set -euo pipefail
          case "${GCR_HOST}" in
            gcr.io|us.gcr.io) AR_LOCATION="us";     AR_REPO="gcr.io";;
            eu.gcr.io)        AR_LOCATION="europe";  AR_REPO="eu.gcr.io";;
            asia.gcr.io)      AR_LOCATION="asia";    AR_REPO="asia.gcr.io";;
            *) echo "Unsupported GCR_HOST=${GCR_HOST}"; exit 1;;
          esac
          if ! gcloud artifacts repositories describe "${AR_REPO}" --location="${AR_LOCATION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${AR_REPO}" \
              --location="${AR_LOCATION}" \
              --repository-format=docker \
              --description="Backs ${GCR_HOST} for this project"
          fi

      - name: Enable gcr.io redirection
        run: |
          gcloud artifacts settings enable-upgrade-redirection \
            --project="${GCP_PROJECT_ID}" --quiet || true

      - name: Configure Docker auth for gcr.io
        run: gcloud auth configure-docker ${{ env.GCR_HOST }} --quiet

      - name: Compute image tags
        id: image
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-7)
          IMAGE_REF="${{ env.GCR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${TAG}"
          UI_IMAGE_REF="${{ env.GCR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.UI_IMAGE_NAME }}:${TAG}"
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "image_ref=${IMAGE_REF}" >> $GITHUB_OUTPUT
          echo "ui_image_ref=${UI_IMAGE_REF}" >> $GITHUB_OUTPUT

      - name: Docker build & push (API)
        run: |
          set -euo pipefail
          echo "Building ${{ steps.image.outputs.image_ref }} from ./supermart-iot ..."
          docker build -t "${{ steps.image.outputs.image_ref }}" --no-cache ./supermart-iot
          echo "Pushing ${{ steps.image.outputs.image_ref }} ..."
          docker push "${{ steps.image.outputs.image_ref }}"

      - name: Docker build & push (UI)
        run: |
          set -euo pipefail
          echo "Building ${{ steps.image.outputs.ui_image_ref }} from ./supermart-ui ..."
          docker build -t "${{ steps.image.outputs.ui_image_ref }}" --no-cache ./supermart-ui
          echo "Pushing ${{ steps.image.outputs.ui_image_ref }} ..."
          docker push "${{ steps.image.outputs.ui_image_ref }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Terraform — deploy to dev
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy — dev
    runs-on: ubuntu-latest
    environment: dev
    needs: [build-and-push]

    env:
      TF_VAR_image: ${{ needs.build-and-push.outputs.image_ref }}
      TF_VAR_ui_image: ${{ needs.build-and-push.outputs.ui_image_ref }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      WORKING_DIR: ./terraform/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP (OIDC)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_PROVIDER_ID }}
          service_account: ${{ env.GCP_SA_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Export GCP credentials for Terraform
        run: echo "GOOGLE_OAUTH_ACCESS_TOKEN=${{ steps.auth.outputs.access_token }}" >> $GITHUB_ENV

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 466.0.0'

      - name: Enable required GCP APIs
        run: |
          set -euo pipefail
          gcloud --quiet services enable \
            cloudresourcemanager.googleapis.com \
            compute.googleapis.com \
            iam.googleapis.com \
            run.googleapis.com \
            servicenetworking.googleapis.com \
            sqladmin.googleapis.com \
            vpcaccess.googleapis.com

      # Create the GCS state bucket if it doesn't exist (idempotent — ignores 409)
      # Note: versioning is intentionally NOT enabled — GCS versioning creates
      # tombstone objects on delete that break Terraform's If-None-Match locking.
      - name: Ensure GCS Terraform state bucket exists
        run: |
          BUCKET="tfstate-test-supermart-dev"
          gcloud storage buckets create "gs://${BUCKET}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --location=US \
            --uniform-bucket-level-access 2>&1 | true
          echo "Bucket ${BUCKET} ready."

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      # Remove stuck Cloud Run services if a prior failed run left deletion_protection issues
      - name: Clean up stuck Cloud Run services (if any)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          gcloud run services delete test-svc-supermart-dev \
            --region=${{ env.REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet 2>/dev/null || true
          gcloud run services delete ui-svc-supermart-dev \
            --region=${{ env.REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet 2>/dev/null || true
          terraform state rm module.compute.google_cloud_run_v2_service.test_supermart_app \
            2>/dev/null || true
          terraform state rm \
            module.compute.google_cloud_run_v2_service_iam_member.test_supermart_public_invoker \
            2>/dev/null || true
          terraform state rm module.compute.google_cloud_run_v2_service.test_supermart_ui \
            2>/dev/null || true
          terraform state rm \
            module.compute.google_cloud_run_v2_service_iam_member.test_supermart_ui_public_invoker \
            2>/dev/null || true

      # Remove all versions of the state lock (including GCS tombstones from prior runs)
      - name: Clear stale Terraform state lock (if any)
        run: |
          gcloud storage rm --all-versions \
            gs://tfstate-test-supermart-dev/terraform/state/default.tflock \
            2>/dev/null || true

      # Reconcile Terraform state with actual GCP resources after partial runs
      - name: Reconcile Terraform state
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          # Remove stale VPC connector (removed from config) from state if present
          terraform state rm module.vpc.google_vpc_access_connector.test_supermart_conn \
            2>/dev/null || true

          # Import Cloud SQL instance only if it exists in GCP AND is absent from state
          IN_GCP=false
          IN_STATE=false
          gcloud sql instances describe test-supermart-db-dev \
            --project="${{ env.GCP_PROJECT_ID }}" >/dev/null 2>&1 && IN_GCP=true
          terraform state list 2>/dev/null | \
            grep -q "module.database.google_sql_database_instance.test_supermart_db" \
            && IN_STATE=true || true
          if [ "$IN_GCP" = "true" ] && [ "$IN_STATE" = "false" ]; then
            echo "Cloud SQL instance exists in GCP but not in state — importing..."
            terraform import \
              module.database.google_sql_database_instance.test_supermart_db \
              "projects/${{ env.GCP_PROJECT_ID }}/instances/test-supermart-db-dev"
          fi

      # Reconcile steps (state rm / import) leave lock tombstones — clear before Plan
      - name: Clear Terraform state lock before Plan
        run: |
          gcloud storage rm --all-versions \
            gs://tfstate-test-supermart-dev/terraform/state/default.tflock \
            2>/dev/null || true

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan -input=false -out=tfplan \
            -var="image=${{ env.TF_VAR_image }}" \
            -var="ui_image=${{ env.TF_VAR_ui_image }}" \
            -var="db_password=${{ env.TF_VAR_db_password }}" \
            -var="jwt_secret=${{ env.TF_VAR_jwt_secret }}"

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 3

      # Plan releases the lock on completion — clear its tombstone before Apply
      - name: Clear Terraform state lock before Apply
        run: |
          gcloud storage rm --all-versions \
            gs://tfstate-test-supermart-dev/terraform/state/default.tflock \
            2>/dev/null || true

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -input=false tfplan

      - name: Show deployment URLs
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "=== Deployment Complete ==="
          echo "UI (Frontend): $(terraform output -raw ui_url)"
          echo "API (Backend): $(terraform output -raw cloud_run_url)"
          echo "Swagger UI:    $(terraform output -raw swagger_ui_url)"

      - name: Post failure summary to PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## IaC Deploy — dev FAILED\n\n**Job:** deploy-dev\n**Commit:** ${{ github.sha }}\n\nCheck the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;
            if (context.payload.pull_request) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }
